name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve Android version codes
        id: aver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            NAME="$GITHUB_REF_NAME"
          else
            VER="0.0.${{ github.run_number }}"
            NAME="$VER"
          fi
          IFS=. read -r MA MI PA <<< "${VER}."
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          CODE=$((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))
          if [ "$CODE" -lt 200 ]; then CODE=$((CODE + 1000)); fi
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: android
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERSION_CODE: ${{ steps.aver.outputs.version_code }}
          VERSION_NAME: ${{ steps.aver.outputs.version_name }}
        run: gradle assembleRelease --no-daemon

      # Forks without the KEYSTORE_* secrets get a throwaway key, so their APK can't upgrade over this one.
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.p12
          else
            export KEYSTORE_PASSWORD=throwaway
            keytool -genkeypair -keystore release.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Cursor Remote Lite"
          fi
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --out CursorRemote.apk aligned.apk
          "$BT/apksigner" verify --print-certs CursorRemote.apk
          rm release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: CursorRemote-apk
          path: CursorRemote.apk

      # Full multi-asset releases are owned by .github/workflows/release.yml
