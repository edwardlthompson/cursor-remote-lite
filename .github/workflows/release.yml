name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (workflow_dispatch only)'
        required: false
        default: '1.6.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version || '0.0.0') }}
        run: gradle assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.p12
          else
            export KEYSTORE_PASSWORD=throwaway
            keytool -genkeypair -keystore release.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Cursor Remote Lite"
          fi
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --out CursorRemote.apk aligned.apk
          "$BT/apksigner" verify --print-certs CursorRemote.apk
          rm -f release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: CursorRemote-apk
          path: CursorRemote.apk

  linux:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CursorRemote-apk
          path: .

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || '1.6.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux tar.gz + deb
        run: |
          chmod +x packaging/linux/build.sh
          ./packaging/linux/build.sh '${{ steps.ver.outputs.version }}' "$(pwd)/CursorRemote.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CursorRemote-linux
          path: |
            packaging/out/CursorRemote-*-linux-x64.tar.gz
            packaging/out/CursorRemote-linux-x64.deb
            packaging/out/CursorRemote_*_amd64.deb

  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build VSIX
        run: |
          mkdir -p packaging/out
          npm --prefix extension ci
          npm --prefix extension run package
          test -f packaging/out/cursor-remote-lite.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: CursorRemote-vsix
          path: packaging/out/cursor-remote-lite.vsix

  windows:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: CursorRemote-apk
          path: .

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || '1.6.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build EXE + MSI
        shell: pwsh
        run: |
          dotnet tool uninstall --global wix 2>$null
          dotnet tool install --global wix --version 5.0.2
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          powershell -ExecutionPolicy Bypass -File .\packaging\windows\build.ps1 `
            -Version '${{ steps.ver.outputs.version }}' `
            -ApkPath (Resolve-Path .\CursorRemote.apk)

      - uses: actions/upload-artifact@v4
        with:
          name: CursorRemote-windows
          path: |
            packaging/out/CursorRemote.exe
            packaging/out/CursorRemote.msi
            packaging/out/CursorRemote-*-win-x64.zip

  release:
    needs: [apk, windows, linux, vsix]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p dist
          cp artifacts/CursorRemote-apk/CursorRemote.apk dist/
          cp artifacts/CursorRemote-windows/CursorRemote.exe dist/
          cp artifacts/CursorRemote-windows/CursorRemote.msi dist/
          cp artifacts/CursorRemote-linux/CursorRemote-linux-x64.deb dist/
          cp artifacts/CursorRemote-linux/CursorRemote-*-linux-x64.tar.gz dist/
          cp artifacts/CursorRemote-vsix/cursor-remote-lite.vsix dist/
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOF'
          ## Cursor Remote ${{ github.ref_name }}

          Free MIT fork — tray packaging, tablet dashboard, clipboard bridge, multi-device lock, diff review, quick prompts, Android finish alerts with sound.

          ### Downloads
          - **CursorRemote.exe** / **CursorRemote.msi** — Windows **system tray** (Start with Windows). ADB auto-pair when the APK is nearby.
          - **CursorRemote-linux-x64.deb** / **CursorRemote-*-linux-x64.tar.gz** — Linux Mint / Ubuntu (`cursor-remote`).
          - **cursor-remote-lite.vsix** — free Cursor/VS Code extension (setup panel + sidebar).
          - **CursorRemote.apk** — Android (**Cursor Remote**); heads-up + sound when the Agent finishes.

          ### First run
          1. Install the desktop package (Windows tray preferred) or the VSIX.
          2. Install the APK, or leave it next to the desktop app with USB debugging — ADB install + pairing run automatically.
          3. In the app: ⋯ → Turn on notifications → Send a test notification.
          Optional: TELEGRAM_BOT_TOKEN + /start for Approve/Skip/Stop/Continue.
          See CHANGELOG.md for the full 1.8.x notes.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Cursor Remote $GITHUB_REF_NAME" \
            --notes "$NOTES"
          