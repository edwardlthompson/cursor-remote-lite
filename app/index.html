<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cursor Remote">
<meta name="theme-color" content="#1e1e1e">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cursor Remote</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #1e1e1e; color: #d4d4d4; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { position: fixed; left: 0; top: 0; width: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button, select, textarea, input { font: inherit; color: #e6e6e6; background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 8px; }
  button { padding: 6px 12px; white-space: nowrap; cursor: pointer; }
  button:active { filter: brightness(1.3); }
  button.on, button.primary { background: #0e639c; border-color: #1177bb; color: #fff; }
  [hidden] { display: none !important; }

  header { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #252526; border-bottom: 1px solid #333; min-width: 0; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #c33; flex: none; }
  #dot.ok { background: #3c3; }
  #title { flex: 1; min-width: 0; max-width: 42%; display: flex; align-items: center; gap: 4px; background: none; border: none; padding: 4px 2px; text-align: left; color: #ccc; font-size: 14px; }
  #title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #title::after { content: "▾"; color: #888; flex: none; }
  .seg { display: flex; flex: none; border: 1px solid #3c3c3c; border-radius: 8px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 5px 10px; background: #2d2d2d; }
  .seg button.on { background: #0e639c; }
  #menuBtn { flex: none; padding: 5px 10px; }

  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; flex-direction: column; min-width: 0; }
  .view.active { display: flex; }

  /* chat view */
  #list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 12px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #older { display: block; margin: 0 auto 10px; font-size: 13px; color: #aaa; background: transparent; }
  .msg { margin: 8px 0; min-width: 0; overflow-wrap: anywhere; }
  .human { display: flex; justify-content: flex-end; }
  .human .bubble { max-width: 88%; background: #264f78; color: #fff; padding: 8px 12px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
  .assistant { padding: 2px 2px; }
  .assistant p { margin: 0 0 .6em; }
  .assistant ul, .assistant ol { margin: 0 0 .6em; padding-left: 1.3em; }
  .assistant h1, .assistant h2, .assistant h3, .assistant h4 { font-size: 1.05em; margin: .8em 0 .4em; }
  .assistant code { background: #333; padding: 1px 4px; border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; }
  .assistant pre { background: #111; padding: 8px 10px; border-radius: 8px; overflow-x: auto; font: 12.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre; }
  .assistant table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 13px; margin: 0 0 .6em; }
  .assistant td, .assistant th { border: 1px solid #444; padding: 4px 6px; }
  .assistant blockquote { margin: 0 0 .6em; padding-left: 10px; border-left: 3px solid #555; color: #aaa; }
  .tool { font: 12.5px/1.4 ui-monospace, Menlo, monospace; color: #9da5b4; background: #252526; border: 1px solid #303030; border-radius: 8px; padding: 6px 9px; }
  .tool .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .thinking, .other { font-size: 12px; color: #777; padding-left: 2px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .btns button { font-size: 13px; padding: 5px 10px; }
  .btns button.primary { font-weight: 600; }
  #empty { color: #888; text-align: center; margin-top: 30vh; padding: 0 20px; }
  #toBottom { position: absolute; right: 14px; bottom: 12px; border-radius: 20px; padding: 6px 12px; background: #333d; display: none; }
  #actionBar { flex: none; display: none; gap: 8px; flex-wrap: wrap; padding: 8px 12px; background: #2a2d2e; border-top: 1px solid #333; }
  #actionBar.show { display: flex; }
  #actionBar button { flex: 1; padding: 9px; font-weight: 600; }
  #queueBar { flex: none; display: none; flex-direction: column; gap: 6px; padding: 7px 12px; background: #23272e; border-top: 1px solid #333; max-height: 34vh; overflow-y: auto; }
  #queueBar.show { display: flex; }
  #qnBar { flex: none; display: none; flex-direction: column; gap: 8px; padding: 10px 12px; background: #2a2620; border-top: 2px solid #e5c07b; max-height: 48vh; overflow-y: auto; }
  #qnBar.show { display: flex; }
  #qnBar .qnHead { font-size: 12.5px; color: #e5c07b; font-weight: 600; }
  #qnBar .qnQ { font-size: 14.5px; color: #eee; white-space: pre-wrap; }
  #qnBar .qnOpts { display: flex; flex-direction: column; gap: 6px; }
  #qnBar .qnOpt { text-align: left; font-size: 14px; padding: 8px 10px; display: flex; gap: 8px; }
  #qnBar .qnOpt b { color: #999; flex: none; }
  #qnBar .qnOpt.on { border-color: #e5c07b; background: #3a3220; }
  #qnBar .qnOpt.on b { color: #e5c07b; }
  #qnBar .qnFree { display: flex; gap: 6px; }
  #qnBar .qnFree input { flex: 1; min-width: 0; font-size: 14px; }
  #qnBar .qnFree.on input { border-color: #e5c07b; }
  #qnBar .qnAct { display: flex; gap: 8px; justify-content: flex-end; }
  #qnBar .qnAct button { padding: 7px 16px; }
  #qnBar .qnAct .primary { background: #0e639c; border-color: #1177bb; color: #fff; font-weight: 600; }
  #qnBar .qnAct .primary:disabled { opacity: .45; }
  #queueBar .run { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #9cc8ff; }
  #queueBar .run span { flex: 1; min-width: 0; }
  #queueBar .run i { width: 8px; height: 8px; border-radius: 50%; background: #4af; flex: none; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #queueBar .qh { font-size: 12px; color: #999; }
  #queueBar .qh.fold { background: none; border: none; padding: 2px 0; text-align: left; color: #9cc8ff; font-size: 12.5px; }
  #queueBar .q { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
  #queueBar .q .qt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ccc; }
  #queueBar .q .qt::before { content: "○ "; color: #777; }
  #queueBar .q .qt.sa::before { content: "⇢ "; color: #4af; }
  #queueBar .run.sub { color: #e5c07b; }
  #queueBar button { font-size: 12px; padding: 3px 9px; flex: none; }

  /* screen view */
  .tools { flex: none; display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; scrollbar-width: none; background: #252526; border-bottom: 1px solid #333; min-width: 0; }
  .tools::-webkit-scrollbar { display: none; }
  #view { flex: 1; min-height: 0; overflow: auto; background: #111; -webkit-overflow-scrolling: touch; }
  #stage { position: relative; overflow: hidden; margin: 0 auto; }
  #screen { position: absolute; left: 0; top: 0; max-width: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-x pan-y; }
  #view.scroll #screen { touch-action: none; }
  #ripple { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid #4af; pointer-events: none; opacity: 0; transition: opacity .4s; }

  /* composer */
  footer { flex: none; background: #252526; border-top: 1px solid #333; padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #presenceBar { display: none; align-items: center; gap: 8px; padding: 6px 8px; margin: 0 -2px; border-radius: 8px; background: #3a2f1a; border: 1px solid #6b5420; font-size: 12.5px; color: #f0d78c; }
  #presenceBar.show { display: flex; }
  #presenceBar button { flex: none; font-size: 12px; padding: 4px 10px; }
  #quickPrompts { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding-bottom: 2px; }
  #quickPrompts::-webkit-scrollbar { display: none; }
  #quickPrompts button { font-size: 12px; padding: 4px 10px; border-radius: 14px; flex: none; white-space: nowrap; background: #2d2d30; color: #ccc; }
  #quickPrompts button.qp-add { color: #8ec7ff; border-style: dashed; }
  #chatTools { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  #chatTools::-webkit-scrollbar { display: none; }
  #chatTools button { font-size: 12.5px; padding: 3px 10px; border-radius: 14px; flex: none; white-space: nowrap; }
  #chatTools #pickModel { flex: 0 1 auto; min-width: 84px; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; gap: 8px; min-width: 0; align-items: flex-end; }
  footer.locked .row, footer.locked #quickPrompts, footer.locked #chatTools { opacity: 0.45; pointer-events: none; }
  #diffView, #paneDiffBody { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 55dvh; overflow: auto; background: #1e1e1e; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  #diffView .add, #paneDiffBody .add { color: #73c991; }
  #diffView .del, #paneDiffBody .del { color: #f14c4c; }
  #diffView .meta, #paneDiffBody .meta { color: #888; }
  textarea { flex: 1; min-width: 0; min-height: 40px; max-height: 32vh; padding: 9px 10px; resize: none; font-size: 16px; line-height: 1.35; }
  #img { flex: none; height: 40px; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center; color: #bbb; }
  #mic { display: none; }
  body.voice #mic { flex: none; height: 40px; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center; color: #bbb; }
  #mic.on { color: #fff; background: #c33; border-color: #e55; animation: pulse 1.2s ease-in-out infinite; }
  #send { flex: none; height: 40px; padding: 0 16px; background: #0e639c; border-color: #1177bb; color: #fff; font-weight: 600; }
  #msg { font-size: 12px; color: #888; min-height: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #msg.err { color: #f77; }

  /* bottom sheet */
  #shade { position: fixed; inset: 0; z-index: 30; background: #0008; display: none; }
  #shade.open { display: block; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: #252526; border-radius: 14px 14px 0 0; padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); max-height: 75dvh; overflow-y: auto; transform: translateY(105%); transition: transform .2s; }
  #sheet.open { transform: none; }
  #sheet h3 { margin: 2px 4px 10px; font-size: 15px; color: #ccc; font-weight: 600; }
  .opt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 11px 12px; margin-bottom: 6px; white-space: normal; }
  .opt .lbl { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .opt .sub { display: block; font-size: 12px; color: #888; margin-top: 2px; }
  .opt .tag { flex: none; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #3a3d41; color: #bbb; }
  .opt.cur { border-color: #1177bb; }
  .opt.cur::after { content: "✓"; color: #4af; flex: none; }
  .askQ { white-space: pre-line; line-height: 1.5; margin: 6px 4px 16px !important; color: #e6e6e6 !important; }
  .askBtns { display: flex; gap: 10px; }
  .askBtns button { flex: 1; padding: 12px; font-size: 15px; }
  button.danger { background: #a1260d; border-color: #c4321a; color: #fff; font-weight: 600; }
  .optRow { display: flex; gap: 6px; align-items: stretch; margin-bottom: 6px; }
  .optRow .opt { margin-bottom: 0; flex: 1; min-width: 0; }
  .paramBtn { flex: none; padding: 0 12px; font-size: 13px; }
  .switch { flex: none; width: 36px; height: 20px; border-radius: 10px; background: #555; position: relative; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #ddd; transition: left .15s; }
  .switch.on { background: #0e639c; }
  .switch.on::after { left: 18px; }
  .sub .add { color: #73c991; }
  .sub .del { color: #f14c4c; }
  .pSec { font-size: 12px; color: #999; margin: 10px 4px 6px; }
  .pRow { display: flex; flex-wrap: wrap; gap: 6px; }
  .pRow button { padding: 8px 12px; font-size: 13.5px; }
  .pRow button.on { border-color: #1177bb; background: #0e639c; color: #fff; }
  .hint { font-size: 13px; color: #999; margin: 4px 4px 10px; line-height: 1.6; }
  .qrs { display: flex; gap: 10px; margin: 4px 0 10px; }
  .qrs figure { flex: 1; min-width: 0; margin: 0; text-align: center; font-size: 13px; color: #aaa; }
  .qrs img { display: block; width: 100%; border-radius: 10px; margin-bottom: 4px; }
  a.opt { color: #e6e6e6; text-decoration: none; background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 8px; box-sizing: border-box; }

  /* file links + viewer */
  .assistant code[data-file], .tool[data-file] { cursor: pointer; }
  .assistant code[data-file] { color: #6cb6ff; text-decoration: underline; text-decoration-color: #6cb6ff66; text-underline-offset: 2px; }
  .tool[data-file] .txt::before { content: "📄 "; }
  #viewer { position: fixed; inset: 0; z-index: 25; background: #1e1e1e; display: none; flex-direction: column;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #viewer.open { display: flex; }
  #viewer .bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #252526; border-bottom: 1px solid #333; min-width: 0; }
  #viewer .names { flex: 1; min-width: 0; line-height: 1.25; }
  #vName { font-size: 14px; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vPath { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  #vBody { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #vBody .code { font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 6px 0 40px; min-width: max-content; }
  #vBody.wrap .code { min-width: 0; }
  #vBody .l { display: flex; white-space: pre; }
  #vBody.wrap .l { white-space: pre-wrap; overflow-wrap: anywhere; }
  #vBody .l i { flex: none; width: 3.6em; padding-right: 10px; text-align: right; color: #5a5a5a; font-style: normal; user-select: none; -webkit-user-select: none; }
  #vBody .l.hl { background: #264f7855; }
  #vBody img { display: block; max-width: 100%; margin: 12px auto; background: #fff1; }
  #vBody .note { padding: 30px 20px; color: #999; text-align: center; line-height: 1.7; }
  #vBody .note.err { color: #f77; }

  /* gate (login / offline) */
  #gate { position: fixed; inset: 0; z-index: 20; background: #1e1e1e; display: none; flex-direction: column; gap: 12px; padding: calc(60px + env(safe-area-inset-top)) 24px 24px; }
  #gate.open { display: flex; }
  #gate h2 { margin: 0 0 6px; font-size: 20px; color: #eee; }
  #gate input { font-size: 16px; padding: 11px; }
  #gate button { padding: 11px; }
  #gateMsg { color: #aaa; line-height: 1.6; white-space: pre-line; }
  .primary-link { display: block; text-align: center; padding: 11px; border-radius: 8px; background: #0e639c; color: #fff; text-decoration: none; font-weight: 600; }
  #gateInput.code { font-size: 26px; letter-spacing: 8px; text-align: center; }
  #gateMsg.err { color: #f77; }
  #gateInfo { font-size: 12px; color: #777; }

  /* clipboard + tablet dashboard */
  #clipPush, #clipPull { flex: none; height: 40px; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center; color: #bbb; }
  #dashStrip { display: none; flex: none; gap: 6px; padding: 6px 10px; overflow-x: auto; background: #222; border-bottom: 1px solid #333; scrollbar-width: none; }
  #dashStrip::-webkit-scrollbar { display: none; }
  #dashStrip .dw { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 6px 10px; border-radius: 8px; border: 1px solid #3c3c3c; background: #2d2d2d; max-width: 200px; text-align: left; }
  #dashStrip .dw.cur { border-color: #1177bb; }
  #dashStrip .dw .dn { font-size: 12.5px; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
  #dashStrip .dw .ds { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .04em; }
  #dashStrip .dw.running .ds { color: #4af; }
  #dashStrip .dw.waiting .ds { color: #e5c07b; }
  #dashStrip .dw.idle .ds { color: #6a6; }

  /* Files pane — same chrome as chat (scrollable list + empty state) */
  #paneFiles { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 12px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; min-height: 0; }
  #paneFiles .dh { font-size: 13px; color: #aaa; font-weight: 600; margin: 0 0 10px; padding: 0 2px; }
  #dashChanges .dc { display: flex; gap: 6px; align-items: stretch; margin-bottom: 8px; }
  #dashChanges .dc .opt { margin-bottom: 0; flex: 1; text-align: left; }
  #dashEmpty { color: #888; text-align: center; margin-top: 22vh; padding: 0 20px; line-height: 1.6; }
  #paneDiff { display: none; flex: 1; flex-direction: column; gap: 8px; min-height: 0; padding: 10px 12px 12px; }
  #paneDiff.show { display: flex; }
  #paneView.diffing #paneFiles { display: none; }
  #paneDiff .pdHead { flex: none; display: flex; align-items: center; gap: 8px; min-width: 0; }
  #paneDiff .pdHead #paneDiffBack { flex: none; padding: 5px 10px; }
  #paneDiff .pdHead h3 { flex: 1; min-width: 0; margin: 0; font-size: 14px; color: #eee; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #paneDiffBody { flex: 1; min-height: 0; max-height: none; margin-bottom: 0; background: #111; }
  #paneDiff .pdAct { flex: none; display: flex; flex-wrap: wrap; gap: 8px; }
  #paneDiff .pdAct button { flex: 1; min-width: 72px; padding: 8px 10px; }

  /* ≥700px landscape covers Tab S7-class devices (incl. denser DPI / zoom) */
  @media (orientation: landscape) and (min-width: 700px) {
    body.tablet-dash > #dashStrip { display: flex; }
    /* Chat + Files side-by-side (tablet-friendly Cursor layout) */
    body.tablet-dash.dual-pane main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 42%);
      gap: 0;
    }
    body.tablet-dash.dual-pane #chatView,
    body.tablet-dash.dual-pane #paneView {
      position: relative; inset: auto; display: flex !important;
      min-width: 0; min-height: 0; height: 100%;
    }
    body.tablet-dash.dual-pane #paneView {
      border-left: 1px solid #333; background: #1e1e1e;
    }
    body.tablet-dash.dual-pane #screenView { display: none !important; }
    body.tablet-dash.dual-pane #chatView { border-right: 0; }
  }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <button id="title"><span id="titleText">Connecting…</span></button>
  <div class="seg">
    <button id="tabChat" class="on">Chat</button>
    <button id="tabPane">Files</button>
    <button id="tabScreen">Screen</button>
  </div>
  <button id="menuBtn">⋯</button>
</header>

<div id="dashStrip" aria-label="Window status"></div>

<main>
  <section id="chatView" class="view active">
    <div id="list">
      <button id="older">↑ Load earlier messages</button>
      <div id="items"></div>
      <div id="empty" hidden>No chat panel found.<br>Open an Agent chat in Cursor, or switch to "Screen".</div>
    </div>
    <button id="toBottom">↓ Latest</button>
    <div id="qnBar"></div>
    <div id="queueBar"></div>
    <div id="actionBar"></div>
  </section>

  <section id="paneView" class="view" aria-label="Changed files">
    <div id="paneFiles">
      <div class="dh">Changed files</div>
      <div id="dashChanges"><div id="dashEmpty">No pending changes.<br>When the Agent edits files, they show up here — same Keep / Undo as on the desktop.</div></div>
    </div>
    <div id="paneDiff">
      <div class="pdHead">
        <button type="button" id="paneDiffBack">←</button>
        <h3 id="paneDiffTitle">Diff</h3>
      </div>
      <div id="paneDiffBody"></div>
      <div class="pdAct" id="paneDiffAct"></div>
    </div>
  </section>

  <section id="screenView" class="view">
    <div class="tools">
      <button id="cropPanel" class="on">Chat panel</button>
      <button id="cropFull">Whole window</button>
      <button id="modeTap" class="on">Tap</button>
      <button id="modeScroll">Scroll</button>
      <button id="zoom">1x</button>
      <button id="refresh">Refresh</button>
    </div>
    <div id="view"><div id="stage"><img id="screen" alt=""><div id="ripple"></div></div></div>

</main>

  <div class="row">

    <button id="img" title="Attach image" aria-label="Attach image"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>

    <button id="clipPull" title="Copy selection or last code block from Cursor" aria-label="Copy from Cursor"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg></button>

<div id="gate">
  <h2>Cursor Remote</h2>
  <div id="gateMsg"></div>
  <input id="gateInput" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="gateBtn" class="primary"></button>
  <a id="gateApp" class="primary-link" hidden>Open in app</a>
  <button id="gateRetry">Retry</button>
  <div id="gateInfo"></div>
</div>

<script src="i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const PRIMARY = /^(run|allow|accept|approve|keep|continue|build|yes|运行|允许|接受|继续)/i;
const store = {
  get: k => localStorage.getItem('cr-' + k),
  set: (k, v) => v == null ? localStorage.removeItem('cr-' + k) : localStorage.setItem('cr-' + k, v),
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let base = null, info = null, ws = null, authed = false, failures = 0;
let mode = store.get('mode') || 'chat';
let crop = store.get('crop') !== 'full';
let frame = { w: 1000, h: 800 }, panel = null, zoom = 1, tapMode = 'tap', rightNext = false;
let windows = [], currentWindow = null;

// Keep the layout above the on-screen keyboard.
function fitViewport() {
  const vv = window.visualViewport;
  if (vv) document.body.style.height = vv.height + 'px';
}
window.visualViewport?.addEventListener('resize', fitViewport);
fitViewport();

function status(text, ok = true) {
  $('msg').textContent = text;
  $('msg').className = ok ? '' : 'err';
}

function send(obj) {
  if (ws && ws.readyState === 1 && authed) ws.send(JSON.stringify(obj));
  else status('Not connected', false);
}

/* ---------- gate: pairing / 2FA / offline ---------- */
let gateSubmit = null;
function gate({ msg = '', err = false, input = null, retry = false, appLink = null } = {}) {
  $('gate').classList.add('open');
  $('gateMsg').textContent = msg;
  $('gateMsg').className = err ? 'err' : '';
  const inp = $('gateInput');
  inp.hidden = $('gateBtn').hidden = !input;
  gateSubmit = input?.submit || null;
  if (input) {
    inp.value = '';
    inp.placeholder = input.placeholder;
    inp.className = input.code ? 'code' : '';
    inp.inputMode = input.code ? 'numeric' : 'url';
    inp.autocomplete = input.code ? 'one-time-code' : 'off';
    $('gateBtn').textContent = input.button;
    if (input.code) setTimeout(() => inp.focus(), 50);
  }
  $('gateApp').hidden = !appLink;
  if (appLink) $('gateApp').href = appLink;
  $('gateRetry').hidden = !retry;
  $('gateRetry').textContent = typeof retry === 'string' ? retry : 'Retry';
  $('gateInfo').textContent = info?.updated ? 'Computer address updated ' + new Date(info.updated).toLocaleString() : '';
}
const ungate = () => $('gate').classList.remove('open');
$('gateBtn').onclick = () => gateSubmit?.($('gateInput').value.trim());
$('gateInput').onkeydown = e => { if (e.key === 'Enter') $('gateBtn').click(); };
$('gateRetry').onclick = () => boot();

/* ---------- relay discovery & auth ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64u = s => b64(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));

// On GitHub Pages, url.json holds the relay address encrypted with a random key that only paired devices hold.
async function decryptUrl(keyText) {
  const key = await crypto.subtle.importKey('raw', b64u(keyText), 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(info.iv) }, key, b64(info.data));
  return JSON.parse(new TextDecoder().decode(plain)).url;
}

const offline = msg => Object.assign(new Error(msg), { offline: true });
async function resolveBase() {
  if (info.self) return location.origin;
  if (info.v !== 2 || !info.data) throw offline('The computer has not published its address yet (or runs an old version). Restart the service on the computer.');
  const key = store.get('key');
  if (!key) throw Object.assign(new Error(''), { unpaired: true });
  try { return await decryptUrl(key); } catch { throw Object.assign(new Error('Pairing is no longer valid (the computer was reset). Please pair again.'), { unpaired: true, stale: true }); }
}

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json', ...(store.get('token') ? { authorization: 'Bearer ' + store.get('token') } : {}) };
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 10000);
  try {
    return await fetch(base + path, { ...opts, headers, signal: ctl.signal, cache: 'no-store' });
  } finally {
    clearTimeout(timer);
  }
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body || {}) });

// Pairing links look like <app>#pair=<url key>.<one-time code>.
function parsePair(text) {
  const m = /[#&]pair=([\w-]{43})\.([\w-]{16,})/.exec(text || '');
  return m ? { key: m[1], code: m[2] } : null;
}
let pending = parsePair(location.hash);
if (pending) history.replaceState(null, '', location.pathname + location.search);
// Opened from a notification: <app>#win=<window id>.
{
  const m = /[#&]win=([^&]+)/.exec(location.hash);
  if (m) {
    store.set('window', decodeURIComponent(m[1]));
    history.replaceState(null, '', location.pathname + location.search);
  }
}
window.addEventListener('hashchange', () => {
  const p = parsePair(location.hash);
  if (!p) return;
  history.replaceState(null, '', location.pathname + location.search);
  pending = p;
  boot();
});
store.set('pw', null);

function deviceName() {
  const ua = navigator.userAgent;
  const model = /Android [\d.]+; (?:[a-z]{2}-[a-z]{2}; )?([^;)]+?)(?: Build|\))/i.exec(ua)?.[1];
  const kind = inApp ? 'Android app' : /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android browser' : /Mac/.test(ua) ? 'Mac browser' : 'browser';
  return model && !/^K$/.test(model) ? `${model} (${kind})` : kind;
}

function showUnpaired(msg = '') {
  gate({
    msg: (msg ? msg + '\n\n' : '') + 'This device is not paired yet.\nRun npm run pair on the computer and scan the code, or paste the pairing link below.',
    err: !!msg,
    input: { placeholder: 'Paste pairing link', button: 'Pair', submit: pastePair },
  });
}

function pastePair(text) {
  const p = parsePair(text);
  if (!p) return showUnpaired('That is not a pairing link (it should contain #pair=…)');
  let target;
  try { target = new URL(text.trim()); } catch {}
  const here = location.origin + location.pathname;
  // A link for another app address: switch to it (the Android app remembers the new address).
  if (target && /^https?:$/.test(target.protocol) && target.origin + target.pathname !== here) {
    if (inApp) return window.CursorRemoteApp.setUrl(target.href);
    location.href = target.href;
    return;
  }
  pending = p;
  boot();
}

function showTotp(onCode, err = '') {
  gate({
    msg: (err ? err + '\n' : '') + 'Enter the 6-digit "Cursor Remote" code from your Authenticator app',
    err: !!err,
    input: { placeholder: '000000', button: 'Verify', code: true, submit: onCode },
  });
}

async function pair(totp) {
  gate({ msg: 'Pairing…' });
  let r, body;
  try {
    r = await post('/api/pair', { code: pending.code, name: deviceName(), totp });
    body = await r.json().catch(() => ({}));
  } catch {
    return gate({ msg: 'Cannot reach the computer. The pairing link is valid for 10 minutes; try again shortly.', err: true, retry: true });
  }
  if (r.ok) {
    store.set('token', body.token);
    pending = null;
    return connect();
  }
  if (body.needTotp) return showTotp(code => pair(code), body.error);
  pending = null;
  if (store.get('token')) return gate({ msg: (body.error || 'Pairing failed') + '\n\nThis device was paired before and can keep using it.', err: true, retry: 'Continue' });
  showUnpaired(body.error || 'Pairing failed');
}

async function verifyTotp(code) {
  gate({ msg: 'Verifying…' });
  try {
    const r = await post('/api/totp', { code });
    const body = await r.json().catch(() => ({}));
    if (r.ok) return connect();
    showTotp(verifyTotp, body.error || 'Verification failed');
  } catch {
    gate({ msg: 'Cannot reach the computer', err: true, retry: true });
  }
}

async function boot() {
  authed = false;
  clearTimeout(retryTimer);
  // Android browser opened a pairing link: offer to hand it to the installed app instead.
  if (pending && /Android/.test(navigator.userAgent) && !inApp && !pending.stay) {
    const data = pending.key + '.' + pending.code;
    const appUrl = location.origin + location.pathname;
    const link = 'intent://pair?app=' + encodeURIComponent(appUrl) + '&d=' + data
      + '#Intent;scheme=cursorremote;package=com.cursorremote.lite;end';
    gate({ msg: 'Pairing link received.\nTap Continue in browser to pair here.\nOpen in app works if Cursor Remote is installed.', appLink: link, retry: 'Continue in browser' });
    pending.stay = true;
    return;
  }
  gate({ msg: 'Looking for the computer…' });
  let res;
  try {
    res = await fetch('url.json?t=' + Date.now(), { cache: 'no-store' });
  } catch {
    return gate({ msg: "Could not load. Check your phone network (github.io must be reachable).", err: true, retry: true });
  }
  info = res.ok ? await res.json().catch(() => null) : null;
  if (!info) return gate({ msg: "The computer address is not published yet.\nRun npm run public on the computer and keep that window open, then tap Retry in about a minute.", err: true, retry: true });
  if (pending) store.set('key', pending.key);
  try {
    base = await resolveBase();
  } catch (e) {
    if (e.offline) return gate({ msg: e.message, retry: true });
    if (e.stale) { store.set('key', null); store.set('token', null); }
    return showUnpaired(e.message);
  }
  if (pending) return pair();
  if (!store.get('token')) return showUnpaired();
  let me;
  try {
    me = await api('/api/me').then(r => r.json());
  } catch {
    autoRetry();
    return gate({ msg: 'Computer offline: it may be off, asleep, or the service just restarted (a new address takes about a minute). Retrying automatically…', retry: true });
  }
  if (!me.paired) {
    store.set('token', null);
    return showUnpaired('This device was removed. Please pair again.');
  }
  if (me.needTotp) return showTotp(verifyTotp);
  connect();
}

let retryTimer = null;
function autoRetry() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { if (!authed) boot(); }, 15000);
}

function connect() {
  clearTimeout(retryTimer);
  ws = new WebSocket(base.replace(/^http/, 'ws') + '/ws');
  ws.onopen = () => ws.send(JSON.stringify({ t: 'auth', token: store.get('token') }));
  let rejected = false;
  ws.onclose = async () => {
    $('dot').className = '';
    if (!authed) {
      // boot() asks /api/me whether the device was removed or needs 2FA again.
      await sleep(rejected ? 0 : 2000);
      return boot();
    }
    authed = false;
    failures++;
    status('Disconnected, reconnecting…', false);
    await sleep(Math.min(8000, 800 * failures));
    // After repeated failures the relay may have restarted on a new address; rediscover it.
    if (failures >= 3) { failures = 0; return boot(); }
    connect();
  };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'auth') {
      if (!m.ok) { rejected = true; return; }
      authed = true; failures = 0;
      ungate();
      $('dot').className = 'ok';
      status('Connected');
      send({ t: 'mode', mode });
      send({ t: 'windows' });
      const fromNotice = window.CursorRemoteApp?.takeOpenWin?.();
      if (fromNotice) store.set('window', fromNotice);
      send({ t: 'attach', id: store.get('window') || '' });
      const fromAction = window.CursorRemoteApp?.takeNotifAction?.();
      if (fromAction) setTimeout(() => handleNotifAction(fromAction, store.get('window')), 400);
      sentWidth = 0;
      applyQuality();
      send({ t: 'visible', v: document.visibilityState === 'visible' });
      send({ t: 'lang', v: I18N.lang });
      syncNotify();
      syncTabletDash();
      setTimeout(checkAppUpdate, 3000);
    }
    else if (m.t === 'chat') renderChat(m.chat);
    else if (m.t === 'frame') onFrame(m);
    else if (m.t === 'panel') { panel = m.rect; layoutStage(); applyQuality(); }
    else if (m.t === 'windows') { windows = m.list; currentWindow = m.current; if (sheetKind === 'windows') showWindows(); }
    else if (m.t === 'attached') {
      store.set('window', m.id);
      currentWindow = m.id;
      $('titleText').textContent = winLabel(m.title).name;
      send({ t: 'windows' });
    }
    else if (m.t === 'menu') showMenu(m.kind, m.items, m.max);
    else if (m.t === 'params') showParams(m);
    else if (m.t === 'changes') showChanges(m);
    else if (m.t === 'diff') showDiff(m);
    else if (m.t === 'file') showFile(m);
    else if (m.t === 'presence') applyPresence(m);
    else if (m.t === 'dash') renderDash(m);
    else if (m.t === 'clipboard') onClipboardPull(m);
    else if (m.t === 'status') status(m.msg, m.ok);
  };
}

/* ---------- multi-device control lock ---------- */
let hasControl = true;
function applyPresence(m) {
  hasControl = !m.locked || m.self;
  const bar = $('presenceBar');
  const foot = document.querySelector('footer');
  if (!m.locked || m.self) {
    bar.classList.remove('show');
    foot.classList.remove('locked');
    return;
  }
  $('presenceText').textContent = (m.holderName || 'Another device') + ' is controlling this window';
  bar.classList.add('show');
  foot.classList.add('locked');
}
$('takeControl').onclick = () => {
  send({ t: 'claim', win: currentWindow || store.get('window') || '' });
  status('Taking control…');
};

/* ---------- bottom sheet ---------- */
let sheetKind = null;
function openSheet(kind, html) {
  sheetKind = kind;
  $('sheet').innerHTML = html;
  $('shade').classList.add('open');
  $('sheet').classList.add('open');
}
function closeSheet() {
  sheetKind = null;
  $('shade').classList.remove('open');
  $('sheet').classList.remove('open');
}
$('shade').onclick = () => { closeSheet(); askDone?.(false); };

// Android system Back: close overlays instead of finishing the Activity.
window.handleAppBack = () => {
  if ($('viewer').classList.contains('open')) {
    if (history.state?.viewer) history.back();
    else closeViewer();
    return true;
  }
  if ($('sheet').classList.contains('open')) {
    closeSheet();
    askDone?.(false);
    return true;
  }
  return false;
};

// Confirmation for anything that interrupts the Agent or throws work away; resolves false if dismissed.
let askDone = null;
function ask(question, ok = 'OK') {
  askDone?.(false);
  return new Promise(resolve => {
    askDone = v => { askDone = null; resolve(v); };
    openSheet('ask', `<h3 class="askQ">${esc(question)}</h3><div class="askBtns">`
      + `<button id="askNo">Cancel</button><button id="askOk" class="danger">${esc(ok)}</button></div>`);
    $('askOk').onclick = () => { closeSheet(); askDone?.(true); };
    $('askNo').onclick = () => { closeSheet(); askDone?.(false); };
  });
}
// Buttons on Cursor's own cards that stop, reject or discard work.
const RISKY = /^(stop|reject|deny|undo|discard|revert|cancel|delete|remove|停止|拒绝|撤销|丢弃|取消|删除)/i;

const KIND_TAG = { agents: 'Agents', ssh: 'SSH', local: 'Local' };

// Cursor titles look like "file.py — Folder [SSH: host]"; the window is identified by folder (+ host), not the open file.
function winLabel(title) {
  const host = /\[SSH: ([^\]]+)\]/.exec(title)?.[1];
  const parts = title.replace(/\s*\[SSH: [^\]]+\]\s*$/, '').split(' — ').map(s => s.replace(/^●\s*/, '').trim());
  const folder = parts.pop() || title;
  return { name: host ? `${folder} · ${host}` : folder, file: parts.join(' — ') };
}

function showWindows() {
  const rows = windows.map(w => `<button class="opt ${w.id === currentWindow ? 'cur' : ''}" data-win="${esc(w.id)}">
    <span class="tag">${KIND_TAG[w.kind] || ''}</span><span class="lbl">${esc(winLabel(w.title || w.id).name)}${winLabel(w.title || '').file ? `<span class="sub">${esc(winLabel(w.title).file)}</span>` : ''}</span></button>`).join('');
  openSheet('windows', `<h3>Switch Cursor window</h3>${rows || '<div class="hint">No windows found</div>'}`);
}
$('title').onclick = () => { send({ t: 'windows' }); showWindows(); };

const MENU_TITLE = { mode: 'Mode', model: 'Model', history: 'Chat history' };
function showMenu(kind, items, max) {
  if (!items.length) return status('The menu is empty; your Cursor version may differ', false);
  status('');
  const maxRow = typeof max === 'boolean'
    ? `<button class="opt" data-max><span class="lbl">MAX Mode<span class="sub">Larger context, costs more</span></span><span class="switch ${max ? 'on' : ''}"></span></button>` : '';
  openSheet('menu', `<h3>${MENU_TITLE[kind] || ''}</h3>` + maxRow + items.map(it => {
    const pick = `<button class="opt ${it.checked ? 'cur' : ''}" data-kind="${kind}" data-label="${esc(it.label)}"><span class="lbl">${esc(it.label)}</span></button>`;
    return it.params ? `<div class="optRow">${pick}<button class="paramBtn" data-params="${esc(it.id)}" data-plabel="${esc(it.label)}">Params</button></div>` : pick;
  }).join(''));
}

let changesCache = [];
let changesActions = [];
let lastDashChanged = -1;
const isTabletLandscape = () => matchMedia('(orientation: landscape) and (min-width: 700px)').matches;

function showPaneFiles() {
  $('paneView').classList.remove('diffing');
  $('paneDiff').classList.remove('show');
}
function showPaneDiffUi() {
  $('paneView').classList.add('diffing');
  $('paneDiff').classList.add('show');
}

function applyViews() {
  // Landscape + Files → chat and Files pane side-by-side (tablet-friendly Cursor layout).
  const dual = isTabletLandscape() && mode === 'pane';
  document.body.classList.toggle('dual-pane', dual);
  if (dual) {
    $('chatView').classList.add('active');
    $('paneView').classList.add('active');
    $('screenView').classList.remove('active');
  } else {
    $('chatView').classList.toggle('active', mode === 'chat');
    $('paneView').classList.toggle('active', mode === 'pane');
    $('screenView').classList.toggle('active', mode === 'screen');
  }
  $('chatTools').hidden = mode === 'screen';
}

function showChanges(m) {
  status('');
  changesCache = m.files || [];
  changesActions = m.actions || [];
  showPaneFiles();
  renderDashChanges();
  if (!m.files.length) { if (sheetKind === 'changes' || sheetKind === 'diff') closeSheet(); return status('No pending changes'); }
  // Files pane already shows the list — skip the bottom sheet unless it is already open.
  if ((mode === 'pane' || document.body.classList.contains('dual-pane')) && sheetKind !== 'changes' && sheetKind !== 'diff') return;
  openSheet('changes', `<h3>Files changed by the Agent (${m.files.length})</h3>`
    + (m.actions.length ? `<div class="pRow" style="margin-bottom:10px">${m.actions.map(a => `<button data-chbar="${esc(a)}">${esc(a)}</button>`).join('')}</div>` : '')
    + m.files.map((f, i) => `<div class="optRow"><button class="opt" data-chdiff="${esc(f.name)}" data-chi="${i}"><span class="lbl">${esc(f.name)}`
      + `<span class="sub"><span class="add">${esc(f.add)}</span> <span class="del">${esc(f.del)}</span></span></span></button>`
      + `<button class="paramBtn" data-ch="${i}" data-name="${esc(f.name)}" data-act2="keep">Keep</button>`
      + `<button class="paramBtn" data-ch="${i}" data-name="${esc(f.name)}" data-act2="undo">Undo</button></div>`).join('')
    + '<div class="hint">Tap a file for its diff. Keep / Undo work like on the desktop.</div>');
}

function renderDashChanges() {
  const box = $('dashChanges');
  if (!box) return;
  if (!changesCache.length) {
    box.innerHTML = '<div id="dashEmpty">No pending changes.<br>When the Agent edits files, they show up here — same Keep / Undo as on the desktop.</div>';
    return;
  }
  box.innerHTML = (changesActions.length

function formatDiffHtml(text) {
  return esc(text || '').split('\n').map(line => {
    if (line.startsWith('+') && !line.startsWith('+++')) return `<span class="add">${line}</span>`;
    if (line.startsWith('-') && !line.startsWith('---')) return `<span class="del">${line}</span>`;
    if (line.startsWith('@@') || line.startsWith('diff ') || line.startsWith('index ')) return `<span class="meta">${line}</span>`;
    return line;
  }).join('\n');
}

const inApp = /CursorRemoteApp/.test(navigator.userAgent);
const APK_RELEASE = 'https://github.com/edwardlthompson/cursor-remote-lite/releases/latest/download/CursorRemote.apk';
const GH_LATEST = 'https://api.github.com/repos/edwardlthompson/cursor-remote-lite/releases/latest';
// Prefer GitHub Releases; fall back to a copy on the user's Pages host when present.
let apkUrl = APK_RELEASE;
fetch('CursorRemote.apk', { method: 'HEAD' }).then(r => { if (r.ok) apkUrl = new URL('CursorRemote.apk', location.href).href; }).catch(() => {});
const appAddress = () => location.origin + location.pathname.replace(/index\.html$/, '');

// The page itself updates with GitHub Pages; only the Android shell needs a new APK now and then.
const appVersion = /CursorRemoteApp\/v?([\d.]+)/.exec(navigator.userAgent)?.[1];
const newerThan = (a, b) => {
  const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  return false;
};
const apkUpdate = () => {
  const latest = store.get('apkLatest');
  return appVersion && latest && newerThan(latest, appVersion) ? latest : null;
};
async function checkAppUpdate(manual = false) {
  if (!inApp || !appVersion) return;
  // Once per app open (session); manual checks always hit GitHub.
  if (!manual && sessionStorage.getItem('apkCheckedOpen')) return;
  if (manual) status('Checking for updates…');
  try {
    const r = await fetch(GH_LATEST, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error();
    const data = await r.json();
    store.set('apkLatest', String(data.tag_name || '').replace(/^v/, ''));
    store.set('apkChecked', Date.now());
    if (!manual) sessionStorage.setItem('apkCheckedOpen', '1');
    const assets = data.assets || [];
    const asset = assets.find(a => /^CursorRemote\.apk$/i.test(a.name))
      || assets.find(a => /\.apk$/i.test(a.name));
    if (asset?.browser_download_url) apkUrl = asset.browser_download_url;
  } catch {
    if (manual) status('Update check failed; try again later', false);
    return;
  }
  const latest = apkUpdate();
  if (latest) {
    if (manual) {
      status(`Downloading Android app v${latest}…`);
      installAppUpdate();
    } else {
      status(`Android app v${latest} is available; update from "⋯" at the top right`);
    }
  } else if (manual) {
    status('You are on the latest version');
  }
}
function installAppUpdate() {
  if (window.CursorRemoteApp?.update) {
    window.CursorRemoteApp.update(apkUrl);
    status('Downloading the new version; the installer opens when it is done');
  }
  // Older shells can't download: an off-site link opens in the system browser instead.
  else location.href = apkUrl || APK_RELEASE;
}
// Check GitHub for a newer APK every time the Android app opens.
if (inApp) setTimeout(() => checkAppUpdate(false), 1200);

/* ---------- notifications ---------- */
// Android app: its own background listener. Elsewhere: Web Push (iPhone only from the home-screen app).
const nativeNotify = () => Boolean(window.CursorRemoteApp?.setNotify);
const webPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let notifyOn = false;

const swReady = () => Promise.race([navigator.serviceWorker.ready, sleep(5000).then(() => { throw new Error('Notifications did not load; refresh and try again'); })]);
const pushSub = async () => webPush() ? (await swReady()).pushManager.getSubscription() : null;
const nativeConfig = () => JSON.stringify({ app: appAddress(), key: store.get('key') || '', token: store.get('token') || '' });

// After every connect: refresh the menu state and re-register, since re-pairing gives the device a new id.
async function syncNotify() {
  try {
    if (nativeNotify()) {
      notifyOn = window.CursorRemoteApp.notifyEnabled();
      if (notifyOn) window.CursorRemoteApp.setNotify(nativeConfig());
      return;
    }
    const sub = await pushSub();
    notifyOn = Boolean(sub);
    if (sub) await post('/api/push/subscribe', { sub: sub.toJSON() });
  } catch {}
}

async function enableNotify() {
  if (nativeNotify()) {
    window.CursorRemoteApp.setNotify(nativeConfig());
    notifyOn = true;
    return status('Notifications are on. On Huawei and similar phones, allow background activity in Settings → App launch.');
  }
  if (inApp) return status('Update the Android app from the menu first; notifications need the new version', false);
  if (!webPush()) {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    return status(ios && !standalone() ? 'On iPhone, first use Share → Add to Home Screen, then open from the home-screen icon to enable notifications' : 'This browser does not support notifications', false);
  }
  // Must be the first await: iOS only shows the permission prompt directly inside a tap.
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return status('No notification permission; allow it in system settings', false);
  try {
    const { key } = await api('/api/push/key').then(r => r.json());
    const reg = await swReady();
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(key) });
    const r = await post('/api/push/subscribe', { sub: sub.toJSON() });
    if (!r.ok) throw new Error((await r.json()).error || 'Registration failed');
    notifyOn = true;
    status('Notifications are on');
  } catch (e) {
    status('Could not turn on notifications: ' + e.message, false);
  }
}

async function disableNotify() {
  if (nativeNotify()) window.CursorRemoteApp.setNotify('');
  else {
    await (await pushSub().catch(() => null))?.unsubscribe().catch(() => {});
    await post('/api/push/unsubscribe').catch(() => {});
  }
  notifyOn = false;
  status('Notifications are off');
}

window.handleNotifAction = handleNotifAction;
function handleNotifAction(action, win) {
  if (win) openWin(win);
  if (!action) return;
  const go = () => {
    if (action === 'continue') send({ t: 'send', text: 'Continue', submit: true });
    else if (action === 'reply') { $('text')?.focus(); status('Type your reply'); }
    else if (action === 'approve') send({ t: 'click', item: 'g', n: 0 });
    else if (action === 'skip') send({ t: 'click', item: 'g', n: 1 });
    else if (action === 'stop') send({ t: 'stop' });
  };
  if (authed) go();
  else setTimeout(go, 800);
}
navigator.serviceWorker?.addEventListener('message', e => {
  openWin(e.data?.openWin);
  if (e.data?.notifAction) handleNotifAction(e.data.notifAction, e.data.openWin);
});
document.addEventListener('visibilitychange', () => {
  if (authed) send({ t: 'visible', v: document.visibilityState === 'visible' });
});
// Deep links from notification openWindow hashes
(() => {
  const h = location.hash || '';
  const win = /(?:^|[&#])win=([^&]*)/.exec(h)?.[1];
  if (win) store.set('window', decodeURIComponent(win));
  if (/continue=1/.test(h)) setTimeout(() => handleNotifAction('continue', store.get('window')), 1200);
  else if (/reply=1/.test(h)) setTimeout(() => handleNotifAction('reply', store.get('window')), 1200);
  else if (/approve=1/.test(h)) setTimeout(() => handleNotifAction('approve', store.get('window')), 1200);
  else if (/skip=1/.test(h)) setTimeout(() => handleNotifAction('skip', store.get('window')), 1200);
  else if (/stop=1/.test(h)) setTimeout(() => handleNotifAction('stop', store.get('window')), 1200);
})();

$('sheet').addEventListener('click', async e => {

  if (b.dataset.ch) {

    if (undo && !await ask(`Undo the changes to "${b.dataset.name}"?\nThe file goes back to how it was before the Agent changed it.`, 'Undo')) return send({ t: 'changes' });
    status(undo ? 'Undoing…' : 'Keeping…');
    return send({ t: 'change', i: Number(b.dataset.ch), name: b.dataset.name, act: b.dataset.act2 });
  }
  if (b.dataset.chbar) {

    status('Working…');

  if (b.dataset.section) { status('Applying…'); return send({ t: 'pickParam', model: b.dataset.model, label: b.dataset.plabel, section: b.dataset.section, value: b.dataset.value }); }
  const act = b.dataset.act;
  if (act === 'install') showInstallHelp();

  else if (act === 'copyAddress') {
    await navigator.clipboard?.writeText(appAddress()).then(() => status('Address copied'), () => status('Copy failed; note the address manually', false));
  }
  else if (act === 'changeUrl') window.CursorRemoteApp?.changeUrl();
  else if (act === 'notifyOn') { closeSheet(); enableNotify(); }
  else if (act === 'notifyOff') { closeSheet(); disableNotify(); }
  else if (act === 'notifyTest') {
    closeSheet();
    const r = await post('/api/push/test').catch(() => null);
    status(r?.ok ? 'Test notification sent; it should arrive within seconds' : 'Send failed', Boolean(r?.ok));
  }
  else if (act === 'appUpdate') {

    store.set('voice', store.get('voice') === 'on' ? null : 'on');

    b.querySelector('.switch').classList.toggle('on', store.get('voice') === 'on');

  else if (act === 'devices') showDevices();
  else if (b.dataset.remove) {
    if (!await ask(`Remove "${b.dataset.name}"? It disconnects immediately and must be paired again.`, 'Remove')) return showDevices();
    await post('/api/devices/remove', { id: b.dataset.remove }).catch(() => {});
    showDevices();

    if (!await ask('Unpair this device? You will need to run npm run pair on the computer again to use it.', 'Unpair')) return;
    await post('/api/logout').catch(() => {});
    store.set('token', null); store.set('key', null);
    authed = false; ws?.close();

/* ---------- chat view ---------- */
const list = $('list'), itemsEl = $('items');
const cache = new Map();

function buttonsHtml(labels, item) {
  return labels.map((l, n) =>
    `<button class="${PRIMARY.test(l) ? 'primary' : ''}" data-item="${esc(item)}" data-n="${n}">${esc(l)}</button>`).join('');
}

function renderItem(it) {
  const el = document.createElement('div');
  el.className = 'msg ' + it.k;
  if (it.k === 'human') el.innerHTML = `<div class="bubble">${esc(it.t || '')}</div>`;
  // it.h comes from the whitelist sanitizer in server.mjs (pageHelpers.clean): plain tags only, text escaped.
  else if (it.k === 'assistant') el.innerHTML = it.h || '';
  else if (it.k === 'tool') {
    el.innerHTML = `<div class="txt">${esc(it.t || '')}</div>`;
    if (it.f) el.dataset.file = it.f;
  }
  else el.textContent = it.t || '';
  if (it.b && it.k !== 'human') el.insertAdjacentHTML('beforeend', `<div class="btns">${buttonsHtml(it.b, it.i)}</div>`);
  return el;
}

const nearBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 120;

let lastChat = null;
function renderChat(chat) {
  lastChat = chat;
  $('empty').hidden = !!chat;
  $('older').hidden = !chat;
  $('pickMode').hidden = !chat?.mode;
  $('pickModel').hidden = !chat?.model;
  if (chat?.mode) $('pickMode').textContent = chat.mode + ' ▾';
  if (chat?.model) $('pickModel').textContent = chat.model + ' ▾';
  if (!chat) { itemsEl.replaceChildren(); renderQueue(false, []); renderQuestions(null); return; }
  const stick = nearBottom();
  // Anchor on the first visible item so loading older messages doesn't jump.
  let anchor = null, anchorTop = 0;
  if (!stick) {
    for (const el of itemsEl.children) {
      if (el.offsetTop + el.offsetHeight > list.scrollTop) { anchor = el.dataset.i; anchorTop = el.offsetTop - list.scrollTop; break; }
    }
  }
  const els = chat.items.map(it => {
    const key = JSON.stringify(it);
    const hit = cache.get(it.i);
    if (hit && hit.key === key) return hit.el;
    const el = renderItem(it);
    el.dataset.i = it.i;
    cache.set(it.i, { key, el });
    return el;
  });
  itemsEl.replaceChildren(...els);
  const live = new Set(chat.items.map(it => it.i));
  for (const k of cache.keys()) if (!live.has(k)) cache.delete(k);

  $('actionBar').innerHTML = buttonsHtml(chat.global, 'g');
  $('actionBar').classList.toggle('show', chat.global.length > 0);
  renderQueue(chat.busy, chat.queued || [], chat.subagents || [], chat.readonly, chat.changed);
  if ((mode === 'pane' || document.body.classList.contains('dual-pane')) && (chat?.changed || 0) !== lastDashChanged) {
    lastDashChanged = chat?.changed || 0;
    send({ t: 'changes' });
  }
  renderQuestions(chat.readonly ? null : chat.questions);

  if (stick) list.scrollTop = list.scrollHeight;
  else if (anchor) {
    const el = [...itemsEl.children].find(e => e.dataset.i === anchor);
    if (el) list.scrollTop = el.offsetTop - anchorTop;
  }
  updateToBottom();
}

let subsOpen = false;
// The Agent's ask-question tool: a card with the questions, options, a free-text answer and submit / skip.
let qnSig = '';
function renderQuestions(qs) {
  const bar = $('qnBar');
  const sig = JSON.stringify(qs);
  if (sig === qnSig) return;
  qnSig = sig;
  if (!qs?.list?.length) { bar.innerHTML = ''; bar.classList.remove('show'); return; }
  bar.innerHTML = `<div class="qnHead">❓ The Agent is asking you${qs.list.length > 1 ? ` (${qs.list.length} questions)` : ''}</div>`
    + qs.list.map((q, qi) => `<div class="qnQ">${qs.list.length > 1 ? `${qi + 1}. ` : ''}${esc(q.text)}</div><div class="qnOpts">`
      + q.options.map((o, oi) => {
        const letter = String.fromCharCode(65 + oi);
        return o.free
          ? `<div class="qnFree ${o.sel ? 'on' : ''}"><input data-qi="${qi}" data-oi="${oi}" placeholder="Other…" value="${esc(o.value)}" enterkeyhint="done"><button data-qfree="${qi}:${oi}">Set</button></div>`
          : `<button class="qnOpt ${o.sel ? 'on' : ''}" data-qi="${qi}" data-oi="${oi}"><b>${letter}</b><span>${esc(o.label)}</span></button>`;
      }).join('') + '</div>').join('')
    + `<div class="qnAct"><button data-qpart="skip">Skip</button><button class="primary" data-qpart="submit" ${qs.canSubmit ? '' : 'disabled'}>Submit</button></div>`;
  bar.classList.add('show');
}

$('qnBar').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.qpart) { status(b.dataset.qpart === 'skip' ? 'Skipped' : 'Submitted'); return send({ t: 'question', part: b.dataset.qpart }); }
  if (b.dataset.qfree) {
    const [qi, oi] = b.dataset.qfree.split(':').map(Number);
    return send({ t: 'question', qi, oi, part: 'option', text: b.previousElementSibling.value });
  }
  if (b.dataset.qi) send({ t: 'question', qi: Number(b.dataset.qi), oi: Number(b.dataset.oi), part: 'option' });
};
$('qnBar').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  e.preventDefault();
  e.target.nextElementSibling.click();
});

function renderQueue(busy, queued, subs = [], readonly = false, changed = 0) {
  const bar = $('queueBar');
  let html = '';
  if (readonly) html += `<div class="run sub"><span>Viewing a subagent's chat (read-only)</span><button data-main>Back to main chat</button></div>`;
  if (subs.length && !readonly) {
    html += `<button class="qh fold" data-fold>${subsOpen ? '▾' : '▸'} <span>Subagents running: ${subs.length}</span></button>`;
    if (subsOpen) html += subs.map(n => `<div class="q"><span class="qt sa">${esc(n)}</span>`
      + `<button data-sub="${esc(n)}" data-part="open">View</button><button data-sub="${esc(n)}" data-part="stop">Stop</button></div>`).join('');
  }
  if (busy && !readonly) html += `<div class="run"><i></i><span>${queued.length ? 'Agent is running; the messages below are sent in order when this turn ends' : 'Agent is running; new messages will be queued'}</span><button data-stop>Stop</button></div>`;
  if (queued.length) {
    html += `<div class="qh">Queued: ${queued.length}</div>`;
    html += queued.map(q => `<div class="q"><span class="qt">${esc(q.t || '(empty)')}</span>`
      + `<button data-q="${esc(q.id)}" data-a="edit">Edit</button>`
      + `<button data-q="${esc(q.id)}" data-a="send" title="Interrupt the current turn and send right away">Send now</button>`
      + `<button data-q="${esc(q.id)}" data-a="remove">Delete</button></div>`).join('');
  }
  if (changed && !readonly) html += `<button class="qh fold" data-changes>${changed === 1 ? '1 file changed ›' : changed + ' files changed ›'}</button>`;
  bar.innerHTML = html;
  bar.classList.toggle('show', Boolean(html));
}

function editQueued(id) {
  const q = (lastChat?.queued || []).find(x => x.id === id);
  if (!q) return status('That queued message is gone', false);
  openSheet('queueEdit', `<h3>Edit queued message</h3>
    <textarea id="qEdit" style="width:100%;box-sizing:border-box;min-height:120px;max-height:50dvh;margin-bottom:10px"></textarea>
    <button class="opt" id="qSave" style="justify-content:center;background:#0e639c;border-color:#1177bb;color:#fff;font-weight:600">Save (stays queued)</button>`);
  $('qEdit').value = q.t;
  $('qSave').onclick = () => {
    const v = $('qEdit').value;
    if (!v.trim()) return status('The message cannot be empty; use "Delete" to drop it', false);
    send({ t: 'queue', id, action: 'edit', text: v });
    closeSheet();
    status('Updating queued message…');
  };
}

$('queueBar').onclick = async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if ('changes' in b.dataset) { status('Loading changed files…'); return send({ t: 'changes' }); }
  if ('fold' in b.dataset) { subsOpen = !subsOpen; return renderQueue(lastChat?.busy, lastChat?.queued || [], lastChat?.subagents || [], lastChat?.readonly, lastChat?.changed); }
  if ('stop' in b.dataset) {
    if (!await ask('Stop the Agent?\nWhatever it is doing in this turn will be interrupted.', 'Stop')) return;
    send({ t: 'stop' }); status('Agent stopped'); return;
  }
  if ('main' in b.dataset) { send({ t: 'mainChat' }); status('Returning to main chat…'); return; }
  if (b.dataset.sub) {
    if (b.dataset.part === 'stop' && !await ask(`Stop subagent "${b.dataset.sub}"?\nIts unfinished work will be interrupted.`, 'Stop')) return;
    send({ t: 'subagent', name: b.dataset.sub, part: b.dataset.part });
    status(b.dataset.part === 'stop' ? 'Subagent stopped' : 'Opening subagent…');
    if (b.dataset.part === 'open') list.scrollTop = list.scrollHeight;
    return;
  }
  if (b.dataset.a === 'edit') return editQueued(b.dataset.q);
  if (b.dataset.a === 'send' && !await ask("Send this message now?\nThe Agent's current turn will be interrupted.", "Send now")) return;
  if (b.dataset.a === 'remove' && !await ask('Delete this queued message?', 'Delete')) return;
  send({ t: 'queue', id: b.dataset.q, action: b.dataset.a });
  status(b.dataset.a === 'send' ? 'Queued message sent now' : 'Queued message deleted');
};

function updateToBottom() {
  $('toBottom').style.display = nearBottom() ? 'none' : 'block';
}
list.addEventListener('scroll', updateToBottom);
$('toBottom').onclick = () => { list.scrollTop = list.scrollHeight; };
$('older').onclick = () => send({ t: 'scrollChat', dy: -900 });

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-item]');
  const f = !b && e.target.closest('#items [data-file]');
  if (f) return openFile(f.dataset.file);
  if (!b) return;
  if (RISKY.test(b.textContent.trim()) && !await ask(`Really tap "${b.textContent.trim()}"?`, b.textContent.trim())) return;
  send({ t: 'click', item: b.dataset.item, n: Number(b.dataset.n) });
  status('Tapped: ' + b.textContent);
});

$('pickMode').onclick = () => { status('Loading modes…'); send({ t: 'openMenu', kind: 'mode' }); };
$('pickModel').onclick = () => { status('Loading models…'); send({ t: 'openMenu', kind: 'model' }); };
$('pickHistory').onclick = () => { status('Loading chat history…'); send({ t: 'openMenu', kind: 'history' }); };
$('newChat').onclick = () => { send({ t: 'newChat' }); status('New chat started'); };

/* ---------- file viewer ---------- */
$('vBody').classList.toggle('wrap', store.get('wrap') !== 'off');
$('vWrap').classList.toggle('on', store.get('wrap') !== 'off');

function openFile(ref) {
  $('vName').textContent = ref.split('/').pop();
  $('vPath').textContent = '';
  $('vBody').innerHTML = '<div class="note">Reading from the computer…</div>';
  if (!$('viewer').classList.contains('open')) {
    $('viewer').classList.add('open');
    history.pushState({ viewer: true }, '');
  }
  send({ t: 'file', path: ref });
}

function showFile(m) {
  if (!$('viewer').classList.contains('open') || m.loading) return;
  $('vName').textContent = m.name || '';
  // Leading LRM keeps the rtl ellipsis from reordering the path's slashes.
  $('vPath').textContent = m.path ? '\u200e' + (m.host ? m.host + ':' : '') + m.path + (m.size != null ? ` · ${fmtSize(m.size)}` : '') : '';
  const body = $('vBody');
  if (m.error) {
    body.innerHTML = `<div class="note err">${esc(m.error)}</div><div class="note">You can open it in Cursor from the "Screen" tab</div>`;
    return;
  }
  if (m.image) {
    body.innerHTML = '';
    const img = new Image();
    img.src = m.image;
    body.append(img);
    return;
  }
  const lines = m.text.replace(/\n$/, '').split('\n');
  body.innerHTML = `<div class="code">${lines.map((l, n) =>
    `<div class="l${n + 1 === m.line ? ' hl' : ''}"><i>${n + 1}</i>${esc(l) || ' '}</div>`).join('')}</div>`
    + (m.truncated ? '<div class="note">File too long; showing the first 512 KB</div>' : '');
  body.scrollTop = 0;
  if (m.line) body.querySelector('.hl')?.scrollIntoView({ block: 'center' });
}

const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

function closeViewer() {
  $('viewer').classList.remove('open');
  $('vBody').innerHTML = '';
}
$('vClose').onclick = () => history.state?.viewer ? history.back() : closeViewer();
window.addEventListener('popstate', () => { if ($('viewer').classList.contains('open')) closeViewer(); });
$('vWrap').onclick = () => {
  const on = !$('vBody').classList.contains('wrap');
  $('vBody').classList.toggle('wrap', on);
  $('vWrap').classList.toggle('on', on);
  store.set('wrap', on ? null : 'off');
};

/* ---------- screen view ---------- */
const view = $('view'), stage = $('stage'), screen = $('screen');

function onFrame(m) {
  const resized = m.w !== frame.w || m.h !== frame.h;
  frame = { w: m.w, h: m.h };
  screen.src = 'data:image/jpeg;base64,' + m.data;
  layoutStage();
  if (resized) applyQuality();
}
screen.onload = () => send({ t: 'ack' });

const cropRect = () => crop && panel ? panel : [0, 0, frame.w, frame.h];

function layoutStage() {
  if (mode !== 'screen') return;
  const [rx, ry, rw, rh] = cropRect();
  const stageW = view.clientWidth * zoom;
  const scale = stageW / rw;
  stage.style.width = stageW + 'px';
  stage.style.height = rh * scale + 'px';
  screen.style.width = frame.w * scale + 'px';
  screen.style.left = -rx * scale + 'px';
  screen.style.top = -ry * scale + 'px';
}

let sentWidth = 0;
function applyQuality() {
  if (mode !== 'screen' || !authed) return;
  const [, , rw] = cropRect();
  const px = Math.min(2560, Math.round(view.clientWidth * zoom * devicePixelRatio * frame.w / rw));
  if (Math.abs(px - sentWidth) < 40) return;
  sentWidth = px;
  send({ t: 'quality', quality: 70, maxWidth: px });
}

function setCrop(on) {
  crop = on;
  store.set('crop', on ? 'panel' : 'full');
  $('cropPanel').classList.toggle('on', on);
  $('cropFull').classList.toggle('on', !on);
  layoutStage(); applyQuality();
}
$('cropPanel').onclick = () => setCrop(true);
$('cropFull').onclick = () => setCrop(false);

function norm(e) {
  const r = screen.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}

function ripple(e) {
  const r = stage.getBoundingClientRect(), el = $('ripple');
  el.style.left = (e.clientX - r.left) + 'px';
  el.style.top = (e.clientY - r.top) + 'px';
  el.style.transition = 'none'; el.style.opacity = 1;
  requestAnimationFrame(() => { el.style.transition = 'opacity .4s'; el.style.opacity = 0; });
}

let down = null;
screen.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, t: Date.now(), lastY: e.clientY, lastX: e.clientX, moved: false };
});
screen.addEventListener('pointermove', e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) down.moved = true;
  if (tapMode === 'scroll' && down.moved) {
    const scale = frame.w / screen.getBoundingClientRect().width;
    const dy = (down.lastY - e.clientY) * scale * 1.5, dx = (down.lastX - e.clientX) * scale * 1.5;
    down.lastY = e.clientY; down.lastX = e.clientX;
    const p = norm(down);
    send({ t: 'wheel', x: p.x, y: p.y, dx, dy });
  }
});
screen.addEventListener('pointerup', e => {
  if (!down) return;
  const longPress = Date.now() - down.t > 600;
  if (!down.moved) {
    const p = norm(e);
    const button = rightNext || longPress ? 'right' : 'left';
    rightNext = false; $('rightClick').classList.remove('on');
    send({ t: 'tap', x: p.x, y: p.y, button });
    ripple(e);
  }
  down = null;
});
screen.addEventListener('pointercancel', () => { down = null; });
screen.addEventListener('contextmenu', e => e.preventDefault());

function setTapMode(m) {
  tapMode = m;
  $('modeTap').classList.toggle('on', m === 'tap');
  $('modeScroll').classList.toggle('on', m === 'scroll');
  view.classList.toggle('scroll', m === 'scroll');
}
$('modeTap').onclick = () => setTapMode('tap');
$('modeScroll').onclick = () => setTapMode('scroll');

const ZOOMS = [1, 1.5, 2, 3];
$('zoom').onclick = () => {
  const cx = (view.scrollLeft + view.clientWidth / 2) / (view.scrollWidth || 1);
  const cy = (view.scrollTop + view.clientHeight / 2) / (view.scrollHeight || 1);
  zoom = ZOOMS[(ZOOMS.indexOf(zoom) + 1) % ZOOMS.length];
  $('zoom').textContent = zoom + 'x';
  layoutStage();
  view.scrollLeft = cx * view.scrollWidth - view.clientWidth / 2;
  view.scrollTop = cy * view.scrollHeight - view.clientHeight / 2;
  applyQuality();
};
$('refresh').onclick = () => send({ t: 'refresh' });
$('rightClick').onclick = () => { rightNext = !rightNext; $('rightClick').classList.toggle('on', rightNext); };
document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => send({ t: 'key', key: b.dataset.key }));

/* ---------- composer ---------- */
const text = $('text');
function autosize() { text.style.height = 'auto'; text.style.height = text.scrollHeight + 'px'; }
text.addEventListener('input', autosize);
$('send').onclick = () => {
  if (!hasControl) return status('Take control first', false);
  const v = text.value;
  if (!v.trim()) return;
  send({ t: 'send', text: v, submit: true });
  text.value = ''; autosize();
  if (mode === 'chat') list.scrollTop = list.scrollHeight;
};

/* ---------- quick prompts ---------- */
const QP_DEFAULTS = [
  { label: 'Continue', text: 'Continue', submit: true },
  { label: 'Fix tests', text: 'Fix the failing tests', submit: true },
  { label: 'Summarize diff', text: 'Summarize the current diff', submit: true },
  { label: 'Ship it', text: 'Prepare a commit for these changes', submit: false },
];
function loadQuickPrompts() {
  try {
    const raw = store.get('quickPrompts');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed.slice(0, 12);
    }
  } catch { /* */ }
  return QP_DEFAULTS.map(x => ({ ...x }));
}
function saveQuickPrompts(list) {
  store.set('quickPrompts', JSON.stringify(list.slice(0, 12)));
}
function renderQuickPrompts() {
  const list = loadQuickPrompts();
  const el = $('quickPrompts');
  el.innerHTML = list.map((p, i) =>
    `<button type="button" data-qp="${i}" title="Long-press to edit">${esc(p.label || p.text)}</button>`).join('')
    + `<button type="button" class="qp-add" data-qp-add title="Add quick prompt">+</button>`;
}
renderQuickPrompts();
$('quickPrompts').addEventListener('click', e => {
  const add = e.target.closest('[data-qp-add]');
  if (add) {
    const label = prompt('Chip label', 'Continue');
    if (!label) return;
    const body = prompt('Prompt text', label) || label;
    const submit = confirm('Send immediately when tapped? (Cancel = only fill the box)');
    const list = loadQuickPrompts();
    list.push({ label: label.slice(0, 40), text: body.slice(0, 2000), submit });
    saveQuickPrompts(list);
    return renderQuickPrompts();
  }
  const b = e.target.closest('[data-qp]');
  if (!b) return;
  if (!hasControl) return status('Take control first', false);
  const list = loadQuickPrompts();
  const p = list[Number(b.dataset.qp)];
  if (!p) return;
  if (p.submit) {
    send({ t: 'send', text: p.text, submit: true });
    status('Sent: ' + (p.label || p.text));
  } else {
    text.value = p.text;
    autosize();
    text.focus();
  }
});
let qpLongTimer = null;
$('quickPrompts').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-qp]');
  if (!b) return;
  qpLongTimer = setTimeout(async () => {
    qpLongTimer = null;
    const list = loadQuickPrompts();
    const i = Number(b.dataset.qp);
    const p = list[i];
    if (!p) return;
    if (!confirm(`Delete quick prompt "${p.label}"?`)) return;
    list.splice(i, 1);
    saveQuickPrompts(list);
    renderQuickPrompts();
  }, 650);
});
$('quickPrompts').addEventListener('pointerup', () => { clearTimeout(qpLongTimer); qpLongTimer = null; });
$('quickPrompts').addEventListener('pointerleave', () => { clearTimeout(qpLongTimer); qpLongTimer = null; });

/* ---------- voice input ---------- */
// Android WebView has no Web Speech API, so the app uses the system recognizer through the bridge instead.
document.body.classList.toggle('voice', store.get('voice') === 'on');
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
const addVoiceText = s => {
  text.value += (text.value && !/\s$/.test(text.value) && /^\w/.test(s) ? ' ' : '') + s;
  autosize();
};
window.onVoice = s => { $('mic').classList.remove('on'); s ? (addVoiceText(s), status('')) : status("Didn't catch that, try again", false); };
// Photos from phone cameras are several MB; shrink to something the model can read and the relay accepts.
async function shrinkImage(file) {
  if (/^image\/(png|jpeg|gif|webp)$/.test(file.type) && file.size < 600e3) return file;
  const bmp = await createImageBitmap(file);
  let side = 1600, q = 0.85, blob;
  do {
    const k = Math.min(1, side / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    side *= 0.75; q -= 0.1;
  } while (blob.size > 1.5e6 && q > 0.4);
  return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
}

async function readPhoneClipboard() {
  try {
    if (navigator.clipboard?.readText) return await navigator.clipboard.readText();
  } catch { /* permission / insecure */ }
  const v = prompt('Paste text to send into Cursor’s composer');
  return v || '';
}
async function writePhoneClipboard(text) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch { /* */ }
  return false;
}
function onClipboardPull(m) {
  if (!m.text) return;
  writePhoneClipboard(m.text).then(ok => {
    if (ok) status(`Copied from Cursor (${m.source || 'text'}, ${m.text.length} chars)`);
    else {
      text.value = m.text;
      autosize();
      status('Could not write system clipboard — filled the composer instead');
    }
  });
}
$('clipPush').onclick = async () => {
  if (!hasControl) return status('Take control first', false);
  status('Reading clipboard…');
  const t = await readPhoneClipboard();
  if (!t.trim()) return status('Clipboard is empty', false);
  send({ t: 'clipboard', op: 'push', text: t });
};
$('clipPull').onclick = () => {
  status('Copying from Cursor…');
  send({ t: 'clipboard', op: 'pull' });
};

$('img').onclick = () => $('imgFile').click();
$('imgFile').onchange = async () => {
  const file = $('imgFile').files[0];
  $('imgFile').value = '';
  if (!file) return;
  status('Processing image…');
  try {
    const img = await shrinkImage(file);
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(img); });
    send({ t: 'image', data: url.slice(url.indexOf(',') + 1), name: img.name, type: img.type });
  } catch {
    status("Couldn't read that image; try another", false);
  }
};

$('mic').onclick = () => {
  if (window.CursorRemoteApp?.voice) {
    if (!window.CursorRemoteApp.voice(I18N.speech)) return status('No speech recognition service on this phone; use the microphone on your keyboard instead', false);
    $('mic').classList.add('on');
    return status('Listening…');
  }
  if (inApp) return status('Update the Android app for voice input, or use the microphone on your keyboard', false);
  if (!Recognition) return status('This browser has no speech recognition; use the microphone on your keyboard instead', false);
  if (recognizer) return recognizer.stop();
  const before = text.value;
  recognizer = new Recognition();
  recognizer.lang = I18N.speech;
  recognizer.interimResults = true;
  recognizer.onresult = e => {
    text.value = before;
    addVoiceText([...e.results].map(r => r[0].transcript).join(''));
  };
  recognizer.onerror = e => status(
    e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'No microphone permission'
      : e.error === 'network' ? 'Speech recognition cannot reach its server; use the microphone on your keyboard instead'
      : e.error === 'no-speech' ? "Didn't catch that, try again" : e.error, false);
  recognizer.onend = () => { recognizer = null; $('mic').classList.remove('on'); };
  recognizer.start();
  $('mic').classList.add('on');
  status('Listening… (tap again to stop)');
};

window.addEventListener('resize', () => { layoutStage(); applyQuality(); });
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});

setCrop(crop);
setMode(mode);
boot();
</script>
</body>
</html>
